[pytest]
# The suite is ~2000 tests, most of them building real Qt widgets over real game files, and it
# took over two hours in one process - which also crept up to ~11 GB, since what each test leaves
# behind piles up for the whole run. Always run through xdist workers, each with its own share of
# the tests and its own memory - one worker here, as many as the cores on the GitHub CI.
#
#   -n 1               a single worker process: one per core (-n auto) saturates the dev PC (each
#                      worker can reach several GB on the heavy model tests). The GitHub CI passes
#                      -n auto itself (.github/workflows/tests.yml), its runners can take it.
#   --dist worksteal   hand the tests out one by one, and let a worker that has run out take work
#                      back off one that is still busy.
#
# Both parts matter. Keeping a file's tests together (--dist loadfile) makes the longest file the
# floor for the whole run: 6 minutes against 2 for the same slice. And handing out fixed batches
# (the default --dist load) ends the run with one worker grinding through the heavy model tests
# while the other eleven sit idle - which is most of the wall clock, since those are the slow ones.
#
# Every worker is a separate process, so anything the tests share has to go through a file, not
# through memory - which is already the case: the fixtures build their own widgets and write into
# pytest's per-test tmp_path.
#
# To turn it off for a debugging session - a single test, a breakpoint, live output with -s:
#
#   pytest -n0 tests/Ifrit/test_bone_picking.py -s
#
addopts = -n 1 --dist worksteal
testpaths = tests
